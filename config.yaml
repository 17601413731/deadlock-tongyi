# Deadlock 文字聊天双向翻译 —— 运行配置
#
# ⚠️ 这份文件里**只有 translate 和 bridge 两段**，因为只有它们会被现役链路读到。
#    历史上这里还有 app / hotkey / source / console / ocr / display / input / ui
#    八段，全是"外置桌面版"（截屏 OCR + 键盘注入 + Qt 界面）的配置：截屏区域、
#    连击次数、注入等级、悬浮窗字体……那条路线已被游戏内 mod 取代，代码于
#    2026-09-20 删除，这些键现役链路一个字都不读（留着只会让人以为改了有用）。
#
# 玩家真正会改的东西在哪：
#   · API Key / 翻译来源 / 模型 / 收发的开关   → 游戏内聊天框输入 /tongyi 打开面板
#   · API Key 也可以在这里配一次（浏览器）    → http://localhost:8791/settings
#   · 翻译参数（超时、上下文轮数、术语表…）   → 游戏内面板
#     注意：面板里改的值存进 %APPDATA%\deadlock-tongyi\settings.json，
#     它**优先级高于本文件的 translate 段**（所以本文件改了 timeout 之类可能没反应，
#     见 dlchat/settings.py 的 load_settings）。

translate:
  # 默认来源 = DeepSeek 云端官方端点（模型 deepseek-flash）。
  # 想改回本机 Ollama（不出网）：把下面三行换成注释里那组。
  base_url: "https://api.deepseek.com/v1"
  # 默认**留空** = "还没配密钥"。这样游戏里填过一次的密钥（存在
  # %APPDATA%\deadlock-tongyi\settings.json）就是唯一来源，不会被这里压住。
  # 想用环境变量，就写成 " ${DEEPSEEK_API_KEY} " 去掉引号里的空格；注意：设了这个
  # 占位符而环境变量又没设时，它会**盖掉**你在游戏里填的密钥 —— 二选一，别同时用。
  api_key: ""
  model: "deepseek-flash"      # 官方现役 ID：deepseek-flash（便宜，默认）/ deepseek-v4-pro（更强更贵）
  # 本机 Ollama 的写法（切换来源也可以在游戏内 /tongyi 面板里做，不必改这里）：
  #   base_url: "http://localhost:11434/v1"
  #   api_key: "none"
  #   model: "hf.co/tencent/Hy-MT2-7B-GGUF:Q4_K_M"
  # DeepSeek 的思考模式默认是开的（effort=high）：短句会先产出一大段思维链，
  # 直接撞 timeout_s；而且思考模式下 temperature 被忽略、top_p 被抬到 >=0.95。
  # 游戏聊天翻译不需要思考，所以默认关。只对 DeepSeek 端点发这个字段。
  thinking: "off"           # off=关（推荐）/ auto=不发这个字段
  temperature: 0.0          # 短句必须 0，否则模型爱加解释
  top_p: 0.9
  max_tokens: 256
  timeout_s: 12.0
  max_retries: 2
  # ⚠️ 这一行现在**不生效**：上下文轮数改由用户设置里的 context_rounds 管
  # （游戏内 /tongyi 面板可调，默认 1 轮），存在 %APPDATA%\deadlock-tongyi\settings.json。
  # 之所以不在这里读：以前这里写 0，而 settings.json 里也写死 0，改这行没有任何效果。
  context_window: 0
  glossary: true
  max_glossary_terms: 12
  exact_match: true         # 命中聊天轮盘整句时直接返回，不调用模型
  min_request_interval_s: 0.0
  system_extra: ""
  # API Key 也可以在浏览器里配一次就永久生效：http://localhost:8791/settings

bridge:
  enabled: true
  port: 8791
  warmup: true              # 启动桥时预热模型（本机 Ollama 首次要 30~40 秒载入显存）
