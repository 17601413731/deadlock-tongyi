[project]
name = "deadlock-tongyi"
version = "0.1.0"
description = "Deadlock 文字聊天双向翻译：英文聊天→中文显示，中文输入→英文注入"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openai>=1.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "mss>=9.0",
    "pyperclip>=1.8",
    "keyboard>=0.13.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# OCR 来源需要；不装也可以用控制台日志来源（更准，但需要游戏侧开启日志）
ocr = ["rapidocr>=3.0", "dxcam"]
# Windows 内建 OCR 兜底
ocr-win = ["winocr"]
dev = ["pytest>=8.0"]

[project.scripts]
# 桌面端入口（打包后是 deadlock-tongyi.exe，见 packaging/deadlock-tongyi.spec）
deadlock-tongyi = "dlchat.main:main"
# 给 Steam 启动选项用的包装器：先起翻译桥，再启动游戏（见 dlchat/launcher.py）
# 打包后叫 tongyi-launch.exe；这个控制台脚本名保持 dlchat-launch 不动，免得
# 改了之后文档/习惯里的 `dlchat-launch --stay` 失效（不是玩家可见的名字）
dlchat-launch = "dlchat.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dlchat*"]
